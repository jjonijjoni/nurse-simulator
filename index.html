<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간호사 시뮬레이터 & 상담소</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🏥 AI 간호사 시뮬레이터 & 상담소</h1>
        <hr>

        <div id="auth-section" class="card">
            <h2 id="auth-title">로그인 / 회원가입</h2>
            <div class="input-group">
                <input type="email" id="auth-email" placeholder="이메일 주소">
                <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
            </div>
            <div class="btn-group">
                <button id="btn-login" class="btn-primary">로그인</button>
                <button id="btn-signup" class="btn-secondary">회원가입</button>
            </div>
        </div>

        <div id="main-section" class="card hidden">
            <div class="user-profile">
                <span id="user-info">환영합니다!</span>
                <button id="btn-logout" class="btn-danger">로그아웃</button>
            </div>
            
            <div class="api-key-box">
                <input type="password" id="openai-key" placeholder="OpenAI API 키를 입력하세요 (sk-...)">
                <button id="btn-save-key" class="btn-secondary">Key 저장</button>
            </div>
            
            <hr>

            <h3>🩺 실시간 AI 증상 상담 입력</h3>
            <div class="chat-box">
                <textarea id="consult-input" placeholder="현재 증상이나 아픈 곳을 상세히 입력하세요... GPT 간호사가 실시간으로 진단해 드립니다."></textarea>
                <button id="btn-save-consult" class="btn-success">AI 간호사에게 상담받기</button>
            </div>

            <hr>

            <h3>📋 나의 AI 상담 및 진단 기록 내역</h3>
            <div id="consult-history" class="history-list">
                <p class="empty-msg">저장된 상담 기록이 없습니다.</p>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
