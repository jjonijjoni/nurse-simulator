<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🏥 AI 간호사 체험 웹</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

<h1>🏥 AI 간호사 체험 웹</h1>

<hr>

<h2>회원</h2>

<input
type="email"
id="email"
placeholder="이메일">

<input
type="password"
id="password"
placeholder="비밀번호">

<div>

<button id="signupBtn">

회원가입

</button>

<button id="loginBtn">

로그인

</button>

<button id="logoutBtn">

로그아웃

</button>

</div>

<br>

<div id="loginStatus">

로그인 안됨

</div>

<hr>

<h2>OpenAI API</h2>

<input
type="password"
id="apiKey"
placeholder="OpenAI API Key">

<hr>

<h2>AI 환자 상담</h2>

<textarea

id="userInput"

rows="8"

placeholder="증상을 입력하세요."

></textarea>

<br><br>

<button id="sendBtn">

상담하기

</button>

<button id="voiceBtn">

🔊 음성 듣기

</button>

<hr>

<h2>AI 답변</h2>

<div id="answer">

안녕하세요.

어디가 불편하신가요?

</div>

<hr>

<h2>상담 기록</h2>

<div id="history">

</div>

</div>

<script type="module"
src="firebase.js"></script>

<script type="module"
src="ai.js"></script>

<script
src="script.js"></script>

</body>

</html>
